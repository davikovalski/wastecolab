[project]
name = "wastecolab-backend"
version = "0.1.0"
description = "Waste Colab: ETL (Pandas) e API (FastAPI) de rotas de valorização de resíduos"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etl*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracao: precisa de um PostgreSQL/PostGIS em DATABASE_URL"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
packages = ["etl", "app"]

[[tool.mypy.overrides]]
# Subclasses de BaseModel/BaseSettings herdam `Any` do pydantic (falso positivo de
# disallow_any_explicit); nosso código nesses módulos não usa Any.
module = ["etl.config", "app.core.config", "app.schemas.*", "app.core.erros"]
disallow_any_explicit = false
